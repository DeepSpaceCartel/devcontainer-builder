name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch/PR: a new push to a PR cancels its superseded run;
# pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: npm install
      - run: npm run build
      # Fast, cluster-free tests of the pure logic - the BDD suite
      # (npm test) needs a real cluster and runs separately.
      - run: npm run test:unit

  # The service image's `dev` target (built from this checkout's source),
  # built but never pushed, so a Dockerfile break shows up on the PR
  # instead of at release time.
  service-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: service
          target: dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run package

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/devcontainer-builder
      # The optional bundled BuildKit dependency (buildkit.deploy.enabled)
      # means the chart declares a subchart in Chart.yaml - `helm template`
      # fails without it fetched into charts/, even with the dependency
      # disabled by default.
      - run: helm dependency update charts/devcontainer-builder
      - run: helm template charts/devcontainer-builder

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/devcontainer-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate
      - run: terraform test

  # The Coder template: formatting and a provider-schema validate. No
  # backend (Coder owns state) and no plan - that needs a Coder deployment.
  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/coder-kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
