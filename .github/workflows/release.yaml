name: release

# Triggered by a real vX.Y.Z tag on main - one tag stamps the Docker image,
# the Helm chart, and the npm/CLI package together (see the "Release
# strategy" note in docs/home/index.md and CLAUDE.md): they're tightly
# coupled enough (the chart's default image.tag should match the image
# this same tag built, the CLI documents which config/API shape it speaks)
# that versioning them separately would just invite "which chart version
# needs which image version" questions.
#
# A pre-release tag (vX.Y.Z-rc.N, anything with a SemVer -suffix) runs the
# same jobs, but publishes npm under the `next` dist-tag, never moves the
# `latest` image tag, skips the VS Code Marketplace and Open VSX (the
# Marketplace rejects SemVer pre-release versions), and marks the GitHub
# Release as a pre-release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

# One release run per tag, never cancelled halfway through a publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.latest }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      # Full history with tags, to compare this version with every
      # existing release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # SemVer 2.0.0 (https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string),
          # with the leading "v".
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if ! printf '%s' "$TAG" | grep -Eq "$semver"; then
            echo "::error::Tag '$TAG' is not a SemVer version (vMAJOR.MINOR.PATCH[-pre][+build])"
            exit 1
          fi
          version="${TAG#v}"
          core="${version%%+*}"
          if [[ "$core" == *-* ]]; then prerelease=true; else prerelease=false; fi

          # `latest` (image tag, npm dist-tag) only moves for the highest
          # final release, so a patch on an older line can't drag it back.
          highest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ "$prerelease" = false ] && [ "$TAG" = "$highest" ]; then latest=true; else latest=false; fi

          if [ "$prerelease" = true ]; then
            npm_tag=next
          elif [ "$latest" = true ]; then
            npm_tag=latest
          else
            major_minor="$(printf '%s' "$core" | cut -d. -f1,2)"
            npm_tag="release-${major_minor}"
          fi

          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "latest=${latest}"
            echo "npm-tag=${npm_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version} prerelease=${prerelease} latest=${latest} (highest release tag: ${highest:-none}) npm-tag=${npm_tag}"

  npm:
    needs: version
    runs-on: ubuntu-latest
    # id-token: write is the whole mechanism - npm CLI >= 11.5.1 exchanges
    # this job's own GitHub OIDC token for a short-lived publish token
    # itself, via npm's Trusted Publishing
    # (https://docs.npmjs.com/trusted-publishers), no NPM_TOKEN secret
    # needed at all. Scoped to just this job, not the workflow-level
    # `permissions:` block above, since nothing else here needs it.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      # Node 20's own bundled npm (10.x) predates Trusted Publishing
      # support - bump to a real minimum here rather than "latest", so a
      # future npm major release can't silently change this job's
      # behavior out from under it.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm version --no-git-tag-version --allow-same-version "${{ needs.version.outputs.version }}"
      # This package's Trusted Publisher (npmjs.com) is granted the full
      # "publish" action (not the stricter "stage" option) - the `image`
      # job below installs this exact version straight from the registry,
      # so publish has to complete unattended, in this same run, with no
      # manual approval step in between. --tag: `next` for a pre-release,
      # `latest` only for the highest release (see the version job).
      - run: npm publish --access public --tag "${{ needs.version.outputs.npm-tag }}"

  image:
    # Depends on npm, not just version - the release target installs this
    # exact version from the npm registry (see service/Dockerfile), so it
    # has to already be live before this build can even start.
    needs: [version, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # npm's registry has a real, observed propagation delay after
      # `npm publish` returns, and two separate stages of it: the version's
      # *metadata* (what `npm view` reads) shows up first, its *tarball*
      # (what `npm install` actually downloads) only once npm finishes
      # processing the upload. v0.2.0's release passed a metadata-only
      # check here and then hit a 404 on the tarball in the image build,
      # minutes before it became downloadable - so poll for the tarball
      # itself.
      - name: Wait for npm to serve the published tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for i in $(seq 1 60); do
            tarball="$(npm view "@deepspacecartel/devcontainer-builder@${VERSION}" dist.tarball 2>/dev/null || true)"
            if [ -n "$tarball" ] && curl -fsSIL -o /dev/null "$tarball"; then
              echo "@deepspacecartel/devcontainer-builder@${VERSION} is downloadable from npm"
              exit 0
            fi
            echo "Not yet downloadable from npm, retrying in 10s... (${i}/60)"
            sleep 10
          done
          echo "::error::Timed out waiting for @deepspacecartel/devcontainer-builder@${VERSION} to propagate on npm"
          exit 1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: service
          target: release
          build-args: |
            PACKAGE_VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          # `latest` only for the highest final release - never for a
          # pre-release, never for a patch on an older line. (An empty
          # line here is ignored.)
          tags: |
            ghcr.io/deepspacecartel/devcontainer-builder:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.latest == 'true' && 'ghcr.io/deepspacecartel/devcontainer-builder:latest' || '' }}
          # runtime-base (apt installs, non-root user) never actually
          # changes release to release - only the release stage's npm
          # install of the just-published version does. GitHub's own
          # BuildKit cache backend caches every stage (mode=max, not just
          # the final one), so a normal release re-runs the apt-get dance
          # from a cache hit instead of from scratch on both platforms.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/devcontainer-builder
      - run: helm dependency update charts/devcontainer-builder
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GHCR_TOKEN"
          helm package charts/devcontainer-builder \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination /tmp/chart-out
          helm push "/tmp/chart-out/devcontainer-builder-${VERSION}.tgz" \
            oci://ghcr.io/deepspacecartel/charts

  # The VS Code extension (vscode-extension/), packaged once: attached to
  # the GitHub Release below and published to the VS Code Marketplace by
  # vscode-marketplace.
  vscode-extension:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: npm ci
      - run: npm version --no-git-tag-version --allow-same-version "${{ needs.version.outputs.version }}"
      - run: npm run build
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vscode-extension/devcontainer-builder.vsix

  # deepspacecartel.devcontainer-builder on the VS Code Marketplace, which
  # the Coder template installs by ID. Its own job, not a step of the one
  # above: a Marketplace outage or an expired VSCE_PAT (an Azure DevOps PAT
  # with Marketplace > Manage, for a member of the publisher) mustn't hold
  # back the GitHub Release. Skipped for pre-releases: the Marketplace
  # rejects SemVer pre-release versions.
  vscode-marketplace:
    needs: [version, vscode-extension]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
      - run: npx --yes @vscode/vsce@3 publish --packagePath devcontainer-builder.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # The same VSIX on Open VSX (open-vsx.org/extension/deepspacecartel/devcontainer-builder),
  # for VSCodium, Cursor, code-server and other editors that don't use
  # Microsoft's Marketplace. Independent of vscode-marketplace for the same
  # reason, and skipped for pre-releases like it. OVSX_PAT: an Open VSX
  # access token of a member of the deepspacecartel namespace.
  vscode-openvsx:
    needs: [version, vscode-extension]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
      - run: npx --yes ovsx@0 publish devcontainer-builder.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  github-release:
    needs: [version, image, chart, npm, vscode-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # GitHub's "Latest release" badge follows the same rule as the
          # `latest` image tag.
          make_latest: ${{ needs.version.outputs.latest }}
          files: devcontainer-builder.vsix
