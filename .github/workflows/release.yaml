name: release

# Triggered by a real vX.Y.Z tag on main - one tag stamps the Docker image,
# the Helm chart, and the npm/CLI package together (see the "Release
# strategy" note in docs/home/index.md and CLAUDE.md): they're tightly
# coupled enough (the chart's default image.tag should match the image
# this same tag built, the CLI documents which config/API shape it speaks)
# that versioning them separately would just invite "which chart version
# needs which image version" questions.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  npm:
    needs: version
    runs-on: ubuntu-latest
    # id-token: write is the whole mechanism - npm CLI >= 11.5.1 exchanges
    # this job's own GitHub OIDC token for a short-lived publish token
    # itself, via npm's Trusted Publishing
    # (https://docs.npmjs.com/trusted-publishers), no NPM_TOKEN secret
    # needed at all. Scoped to just this job, not the workflow-level
    # `permissions:` block above, since nothing else here needs it.
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # Node 20's own bundled npm (10.x) predates Trusted Publishing
      # support - bump to a real minimum here rather than "latest", so a
      # future npm major release can't silently change this job's
      # behavior out from under it.
      - run: npm install -g npm@^11.5.1
      - run: npm install
      - run: npm run build
      - run: npm version --no-git-tag-version --allow-same-version "${{ needs.version.outputs.version }}"
      # This package's Trusted Publisher (npmjs.com) is granted the full
      # "publish" action (not the stricter "stage" option) - the `image`
      # job below installs this exact version straight from the registry,
      # so publish has to complete unattended, in this same run, with no
      # manual approval step in between.
      - run: npm publish --access public

  image:
    # Depends on npm, not just version - the release target installs this
    # exact version from the npm registry (see service/Dockerfile), so it
    # has to already be live before this build can even start.
    needs: [version, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # npm's registry has a real, observed propagation delay after
      # `npm publish` returns - a build starting immediately after `npm`
      # succeeds can hit "No matching version found" on a version that
      # published only seconds earlier. Poll for it instead of assuming
      # it's already visible.
      - name: Wait for npm to propagate the published version
        run: |
          version="${{ needs.version.outputs.version }}"
          for i in $(seq 1 30); do
            if npm view "@deepspacecartel/devcontainer-builder@${version}" version >/dev/null 2>&1; then
              echo "@deepspacecartel/devcontainer-builder@${version} is live on npm"
              exit 0
            fi
            echo "Not yet visible on npm, retrying in 10s... (${i}/30)"
            sleep 10
          done
          echo "::error::Timed out waiting for @deepspacecartel/devcontainer-builder@${version} to propagate on npm"
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: service
          target: release
          build-args: |
            PACKAGE_VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/deepspacecartel/devcontainer-builder:${{ needs.version.outputs.version }}
            ghcr.io/deepspacecartel/devcontainer-builder:latest
          # runtime-base (apt installs, non-root user) never actually
          # changes release to release - only the release stage's npm
          # install of the just-published version does. GitHub's own
          # BuildKit cache backend caches every stage (mode=max, not just
          # the final one), so a normal release re-runs the apt-get dance
          # from a cache hit instead of from scratch on both platforms.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/devcontainer-builder
      - run: helm dependency update charts/devcontainer-builder
      - run: |
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          helm package charts/devcontainer-builder \
            --version "${{ needs.version.outputs.version }}" \
            --app-version "${{ needs.version.outputs.version }}" \
            --destination /tmp/chart-out
          helm push "/tmp/chart-out/devcontainer-builder-${{ needs.version.outputs.version }}.tgz" \
            oci://ghcr.io/deepspacecartel/charts

  github-release:
    needs: [version, image, chart, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
