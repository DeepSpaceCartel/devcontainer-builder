name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "service/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "service/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

# Keyed on the ref, so a PR's build can never cancel (or queue behind) a
# main deploy. Superseded PR builds are cancelled; main runs always finish.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: npm install
      - run: npm run build
      # Generates docs/openapi.json (repo root) and its two rendered
      # static pages (docs/api-reference.html, docs/api-swagger-ui/) for
      # the two "HTTP API" nav entries (see
      # docs/project/installing.md#this-documentation-site) - the exact
      # same document a running instance serves at GET
      # /documentation/json, never hand-authored.
      - run: OPENAPI_OUTPUT_PATH=../docs/openapi.json node scripts/export-openapi.mjs
      - run: npx redocly build-docs ../docs/openapi.json -o ../docs/api-reference.html
      - run: SWAGGER_UI_OUTPUT_DIR=../docs/api-swagger-ui node scripts/export-swagger-ui.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r ../docs/requirements.txt
      - run: mkdocs build --strict
        working-directory: .
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job publishes, so only it gets Pages/OIDC access.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
