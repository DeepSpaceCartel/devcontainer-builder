# Single replica only (values.schema.json enforces maximum 1): captured
# build output behind GET /logs/{id} lives on this pod's own /tmp emptyDir,
# so a second replica would 404 on log ids the other one returned.
replicaCount: 1

# Empty means k8s's own default (RollingUpdate). Test scenarios that roll
# to a config deliberately expected to never pass readiness need
# `{type: Recreate}` here - otherwise the previous, still-Ready pod keeps
# serving indefinitely instead of being replaced.
updateStrategy: {}

# How long Kubernetes waits after SIGTERM before killing the pod. The
# service stops accepting new requests on SIGTERM and lets in-flight ones
# finish, and a /build request lasts as long as its build - so this is the
# budget an in-flight build gets to complete during a rollout/drain.
terminationGracePeriodSeconds: 300

podSecurityContext:
  runAsNonRoot: true
  # Must match the container image's builder user (service/Dockerfile's
  # `USER 2000:2000`).
  runAsUser: 2000
  runAsGroup: 2000
  # Same gid, so group-readable Secret/ConfigMap volume files (e.g.
  # git-credentials.json, mode 0440) and the emptyDirs are actually
  # readable/writable by the non-root container process.
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext. readOnlyRootFilesystem is safe because
# every path the service writes to is an emptyDir: /tmp (scratch clones,
# per-request credential dirs, captured /logs output, the devcontainers
# CLI's own cache) and DOCKER_CONFIG (/home/builder/.docker, buildx's
# builder state).
securityContext:
  runAsNonRoot: true
  runAsUser: 2000
  runAsGroup: 2000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  # The service never calls the Kubernetes API, so the pod doesn't get a
  # token by default.
  automountServiceAccountToken: false

# e.g. [{name: my-pull-secret}] - for a private copy of the image.
imagePullSecrets: []
# Extra pod annotations, merged with the chart's own checksum/* ones.
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

image:
  repository: ghcr.io/deepspacecartel/devcontainer-builder
  # Empty by default - the deployment template falls back to the chart's
  # own .Chart.AppVersion, so every release's default install/upgrade tracks
  # its own matching image without needing a manual bump here. Set this
  # only to deliberately override that (e.g. pinning to an older image).
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 8080

# Deployment environment name (e.g. "dev"/"staging"/"production") for the
# service's own structured logs/traces (DEPLOYMENT_ENVIRONMENT env var - see
# service/docs/reference/CONFIGURATION.md). Empty means unset - the service
# falls back to its own "development" default, same "unconfigured is a
# supported state" pattern as buildkit.endpoint below. There's no equivalent
# field for the service's own name - that's always .Chart.Name, wired
# unconditionally in deployment.yaml so it can never drift from the
# app.kubernetes.io/name label every other part of this chart already uses.
environment: ""

buildkit:
  # e.g. tcp://buildkit-buildkit-service.buildkit.svc.cluster.local:1234
  # Ignored when deploy.enabled below is true - the endpoint is computed
  # automatically from the bundled release instead.
  endpoint: ""

  deploy:
    # Deploy a bundled BuildKit instance (the buildkitBundled dependency in
    # Chart.yaml) alongside devcontainer-builder itself, for a single `helm
    # install` with zero pre-existing BuildKit infra. Off by default so
    # `buildkit.endpoint` above keeps meaning exactly what it always has -
    # point it at BuildKit already running elsewhere.
    #
    # Real, non-optional prerequisite this doesn't remove: BuildKit's
    # default mode is genuinely privileged (inherent to how it does OCI
    # builds, not a chart shortcoming), and the bundled dependency installs
    # into the release namespace - so label that namespace once, before
    # `helm install` (Pod Security admission rejects BuildKit's pod
    # otherwise):
    #
    #   kubectl create namespace <ns>
    #   kubectl label namespace <ns> pod-security.kubernetes.io/enforce=privileged
    #
    # devcontainer-builder's own pod is unaffected: "privileged" only
    # widens what the namespace *allows*.
    enabled: false

  # Earlier chart versions' behavior: the chart renders the release Namespace
  # itself, labeled privileged. Off by default - a chart-owned Namespace
  # can't be installed into an existing namespace, and conflicts with
  # --create-namespace. Whenever it is rendered it carries
  # `helm.sh/resource-policy: keep`, so `helm uninstall` never deletes the
  # namespace. Installs that already own their Namespace (installed with
  # buildkit.deploy.enabled before this changed) keep rendering it
  # automatically (detected via lookup), so upgrading never deletes it.
  manageNamespace: false

# Values passed through to the bundled BuildKit dependency
# (https://github.com/andrcuns/charts/tree/main/charts/buildkit-service)
# when buildkit.deploy.enabled is true. fullnameOverride pins its Service's
# real name so devcontainer-builder can compute buildkit.endpoint from it
# directly, instead of depending on the subchart's own
# release-name-dependent fullname logic (see its own _helpers.tpl) - the
# exact kind of naming gotcha rts-terraform/docs/buildkit.md documents
# hitting with this same chart deployed standalone.
buildkitBundled:
  fullnameOverride: "buildkit"
  service:
    type: ClusterIP
    port: 1234

build:
  # Default target platform(s) applied when a /build request doesn't
  # specify its own `platforms` (e.g. ["linux/amd64", "linux/arm64"]).
  # Empty means today's behavior: no --platform flag passed, so the build
  # runs on whatever platform the remote BuildKit worker defaults to.
  platforms: []
  # Default BuildKit build options applied when a request doesn't specify
  # its own buildOptions. cacheFrom/cacheTo point at a registry-backed
  # BuildKit layer cache (e.g. "type=registry,ref=ghcr.io/example/app:buildcache",
  # with mode=max on cacheTo to cache every intermediate layer, not just
  # the ones in the final image) - unset by default, same "no ambient
  # behavior" default as buildkit.endpoint.
  noCache: false
  cacheFrom: ""
  cacheTo: ""
  mode: auto # auto | never - passed to `devcontainer build --buildkit`
  # The image a repository without any devcontainer.json is built from,
  # as if it had {"image": "<fallbackImage>"} - so a workspace can start
  # on it and offer to add a configuration (ADR-0013). Empty: such builds
  # fail, as with the Dev Containers CLI.
  fallbackImage: mcr.microsoft.com/devcontainers/base:ubuntu
  # Per-phase timeouts, in seconds, and how many builds run at once (past
  # it, POST /build answers 429 with Retry-After). null keeps the
  # service's defaults: 600, 3600 and 4 (0 = no limit). See
  # docs/reference/CONFIGURATION.md.
  cloneTimeoutSeconds: null
  timeoutSeconds: null
  maxConcurrent: null

git:
  # Allow git:// and http:// repository URLs (unencrypted, and open to SSRF
  # against in-cluster hosts). Off by default; for test git servers only.
  allowInsecureProtocols: false

registryAuth:
  # Name of an existing kubernetes.io/dockerconfigjson-shaped Secret. If
  # set, `registries` below is ignored (existingSecret always wins, same
  # relationship gitCredentials.existingSecret/entries already has).
  existingSecret: ""
  # Real registry push credentials - the chart builds the full
  # dockerconfigjson (`{"auths": {"<registry>": {"auth": "<base64
  # user:pass>"}}}`) from this list, so nobody hand-builds or pre-encodes
  # JSON themselves. Empty list -> {"auths":{}}, same "no ambient auth"
  # default as before this existed.
  registries: []
  # registries:
  #   - registry: https://index.docker.io/v1/ # Docker Hub's real registry host
  #     username: svc-bot
  #     password: hunter2
  #   - registry: ghcr.io
  #     username: svc-bot
  #     password: ghp_example

gitCredentials:
  # Set to false to omit GIT_CREDENTIALS_CONFIG_PATH and its volume entirely
  # (rather than pointing it at a file with an empty entries list).
  enabled: true
  # Server-side default git credentials, looked up by host when a request
  # doesn't supply its own gitCredentials. Provide either an existing Secret
  # (must contain a `git-credentials.json` key, same array shape as `entries`
  # below) or inline entries, which get rendered into a chart-managed Secret.
  existingSecret: ""
  entries: []
  # entries:
  #   - host: github.com
  #     kind: https
  #     username: svc-bot
  #     token: ghp_...
  #   - host: gitlab.internal.example.com
  #     kind: ssh
  #     privateKey: |
  #       -----BEGIN OPENSSH PRIVATE KEY-----
  #       ...
  #     pinnedHostKey: "gitlab.internal.example.com ssh-ed25519 AAAA..."

# tofu = trust-on-first-use via ssh-keyscan at clone time; pinned = require
# entries.[].pinnedHostKey for every SSH git credential (fails closed if
# missing for a host using SSH creds under this policy).
sshHostKeyPolicy: tofu

# Registry hosts (e.g. "registry.registry.svc.cluster.local:5000") the
# service's own registry calls - GET/DELETE /image and GET /devcontainer -
# reach over plain HTTP instead of HTTPS. Builds aren't affected: pushing
# to a plain-HTTP registry is BuildKit's own config (buildkitd.toml).
# Explicit only - there's no automatic HTTPS-to-HTTP fallback.
insecureRegistries: []

registryMapping:
  # Set to false to omit REGISTRY_MAPPING_CONFIG_PATH and its volume
  # entirely (rather than pointing it at a file with an empty rules list).
  enabled: true
  # Provide either an existing ConfigMap (must contain a
  # `registry-mapping.json` key) or inline rules below, which get rendered
  # into a chart-managed ConfigMap.
  existingConfigMap: ""
  # Non-sensitive repo -> registry routing rules, used to resolve
  # image.registry when a request omits it. First matching rule wins, rules
  # are checked in the order given.
  rules: []
  # rules:
  #   - hostMatch: github.com
  #     pathPrefix: "org-a/"
  #     registry: ghcr.io/org-a

# Extra CLI arguments appended to the container's entrypoint (`node
# dist/index.js <extraArgs...>`) - e.g. ["--ssh-host-key-policy", "pinned"].
extraArgs: []

# Extra container env vars, e.g. [{name: FOO, value: bar}] - appended after
# the chart's own env entries, so this can add a var the chart doesn't
# otherwise expose (it's the caller's job to avoid conflicting names).
extraEnv: []

# Extra pod volumes/mounts, e.g. to mount a caller-provided ConfigMap/Secret
# at an arbitrary path (paired with extraEnv above to point an env var like
# GIT_SSL_CAINFO at it). Appended after the chart's own volumes/mounts.
extraVolumes: []
extraVolumeMounts: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# emptyDir mounted at /tmp - every scratch clone, per-request credential
# dir and captured /logs output lives here.
scratchVolume:
  sizeLimit: 5Gi

# emptyDir mounted at DOCKER_CONFIG (/home/builder/.docker) for buildx's
# builder state, needed with readOnlyRootFilesystem; the registry-auth
# config.json is mounted into it.
dockerConfigVolume:
  sizeLimit: 64Mi
