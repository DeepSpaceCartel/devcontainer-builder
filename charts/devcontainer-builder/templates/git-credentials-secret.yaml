{{- if and .Values.gitCredentials.enabled (not .Values.gitCredentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devcontainer-builder.gitCredentialsSecretName" . }}
  labels:
    {{- include "devcontainer-builder.labels" . | nindent 4 }}
type: Opaque
data:
  git-credentials.json: {{ .Values.gitCredentials.entries | toJson | b64enc }}
{{- end }}
