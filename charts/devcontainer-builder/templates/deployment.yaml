apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devcontainer-builder.fullname" . }}
  labels:
    {{- include "devcontainer-builder.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.updateStrategy }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "devcontainer-builder.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devcontainer-builder.labels" . | nindent 8 }}
      annotations:
        # A Secret/ConfigMap's *name* staying the same across an upgrade
        # (the common case here - these are all chart-managed, fixed
        # names) never changes the pod template hash on its own, so
        # Kubernetes has no reason to roll a new pod just because the
        # mounted content changed - the already-running process keeps
        # whatever it read at its own startup. These checksums make
        # content changes show up in the pod template itself, forcing a
        # real rollout whenever any of them change. Skipped for
        # existingSecret/existingConfigMap - that content lives outside
        # this chart's values, so triggering on it is the caller's job.
        checksum/registry-auth: {{ (.Values.registryAuth.dockerConfigJson | default "{\"auths\":{}}") | sha256sum }}
        {{- if and .Values.gitCredentials.enabled (not .Values.gitCredentials.existingSecret) }}
        checksum/git-credentials: {{ .Values.gitCredentials.entries | toJson | sha256sum }}
        {{- end }}
        {{- if and .Values.registryMapping.enabled (not .Values.registryMapping.existingConfigMap) }}
        checksum/registry-mapping: {{ .Values.registryMapping.rules | toJson | sha256sum }}
        {{- end }}
        {{- if .Values.settingsFile.content }}
        checksum/settings: {{ .Values.settingsFile.content | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "devcontainer-builder.fullname" . }}
      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      containers:
        - name: devcontainer-builder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.extraArgs }}
          args:
            {{- toYaml .Values.extraArgs | nindent 12 }}
          {{- end }}
          env:
            - name: PORT
              value: "8080"
            {{- if .Values.buildkit.endpoint }}
            - name: BUILDKIT_ENDPOINT
              value: {{ .Values.buildkit.endpoint | quote }}
            {{- end }}
            - name: DOCKER_CONFIG
              value: /home/builder/.docker
            {{- if .Values.gitCredentials.enabled }}
            - name: GIT_CREDENTIALS_CONFIG_PATH
              value: /home/builder/.config/git-credentials.json
            {{- end }}
            {{- if .Values.registryMapping.enabled }}
            - name: REGISTRY_MAPPING_CONFIG_PATH
              value: /home/builder/.config/registry-mapping.json
            {{- end }}
            {{- if .Values.settingsFile.content }}
            - name: SERVICE_CONFIG_PATH
              value: /home/builder/.config/{{ .Values.settingsFile.filename }}
            {{- end }}
            - name: SSH_HOST_KEY_POLICY
              value: {{ .Values.sshHostKeyPolicy | quote }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
          volumeMounts:
            # Mounted at the specific file, not the whole DOCKER_CONFIG
            # directory - `docker buildx create` needs to write its own
            # builder state under DOCKER_CONFIG/buildx/, which a read-only
            # mount of the whole directory silently forecloses ("mkdir
            # .../buildx: read-only file system", surfacing as an opaque
            # "docker buildx create ... exited with code 1" from build.ts).
            - name: registry-auth
              mountPath: /home/builder/.docker/config.json
              subPath: config.json
              readOnly: true
            {{- if .Values.gitCredentials.enabled }}
            - name: git-credentials
              mountPath: /home/builder/.config/git-credentials.json
              subPath: git-credentials.json
              readOnly: true
            {{- end }}
            {{- if .Values.registryMapping.enabled }}
            - name: registry-mapping
              mountPath: /home/builder/.config/registry-mapping.json
              subPath: registry-mapping.json
              readOnly: true
            {{- end }}
            {{- if .Values.settingsFile.content }}
            - name: settings
              mountPath: /home/builder/.config/{{ .Values.settingsFile.filename }}
              subPath: {{ .Values.settingsFile.filename }}
              readOnly: true
            {{- end }}
            - name: scratch
              mountPath: /tmp
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: registry-auth
          secret:
            secretName: {{ include "devcontainer-builder.secretName" . }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- if .Values.gitCredentials.enabled }}
        - name: git-credentials
          secret:
            secretName: {{ include "devcontainer-builder.gitCredentialsSecretName" . }}
            items:
              - key: git-credentials.json
                path: git-credentials.json
                mode: 0440
        {{- end }}
        {{- if .Values.registryMapping.enabled }}
        - name: registry-mapping
          configMap:
            name: {{ include "devcontainer-builder.registryMappingConfigMapName" . }}
        {{- end }}
        {{- if .Values.settingsFile.content }}
        - name: settings
          configMap:
            name: {{ include "devcontainer-builder.fullname" . }}-settings
        {{- end }}
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.scratchVolume.sizeLimit }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
